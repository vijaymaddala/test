<mat-toolbar #navbarToolbar color="primary" class="navbar">
  <div class="navbar-content">
    <!-- Left side: Menu button and Logo -->
    <div class="navbar-left">
      <button
        *ngIf="showMenuButton"
        mat-icon-button
        (click)="onMenuToggle()"
        class="menu-button"
        aria-label="Toggle menu"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <div class="logo-container" routerLink="/home">
        <img
          src="favicon.svg"
          alt="AI Test Pilot Logo"
          class="logo-image"
          width="32"
          height="32"
        >
        <span class="logo-copy">
          <span class="logo-text">AI Test Pilot</span>
          <span class="logo-caption">Test smarter. Ship confidently.</span>
        </span>
      </div>
    </div>

    <!-- Center: Navigation Links - moved to sidenav -->
    <div class="navbar-center">
      <!-- Navigation links moved to sidenav -->
    </div>

    <!-- Right side: Theme toggle and User menu -->
    <div class="navbar-right">
      <!-- Theme Toggle -->
      <button
        mat-icon-button
        (click)="onThemeToggle()"
        class="theme-toggle-button"
        [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        matTooltip="{{ isDarkMode ? 'Switch to light mode' : 'Switch to dark mode' }}"
      >
        <mat-icon class="theme-icon">{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <!-- User Authentication -->
      <div class="auth-section">
        <!-- Not logged in -->
        <ng-container *ngIf="!isLoggedIn">
          <button
            mat-raised-button
            color="accent"
            (click)="onLogin()"
            class="login-button"
          >
            <mat-icon>login</mat-icon>
            <span>Login</span>
          </button>
        </ng-container>

        <!-- Logged in -->
        <ng-container *ngIf="isLoggedIn">
          <button
            mat-icon-button
            [matMenuTriggerFor]="userMenu"
            class="user-menu-trigger"
            aria-label="User menu"
          >
            <img
              [src]="userAvatar"
              [alt]="userName"
              class="user-avatar"
              (load)="onImageLoad()"
              (error)="onImageError()"
              [style.opacity]="imageLoadError ? '0.7' : '1'"
            >
          </button>

          <mat-menu #userMenu="matMenu" class="user-menu">
            <div class="user-info" mat-menu-item disabled>
              <div class="user-details">
                <div class="user-name">{{ userName }}</div>
                <div class="user-email">{{ userEmail }}</div>
              </div>
            </div>

            <mat-divider></mat-divider>

            <button mat-menu-item (click)="onProfile()">
              <mat-icon>person</mat-icon>
              <span>Profile</span>
            </button>

            <button mat-menu-item (click)="onSettings()">
              <mat-icon>settings</mat-icon>
              <span>Settings</span>
            </button>

            <button mat-menu-item (click)="onAdminPanel()" *ngIf="canAccessAdmin">
              <mat-icon>admin_panel_settings</mat-icon>
              <span>Admin Panel</span>
            </button>

            <mat-divider></mat-divider>

            <button mat-menu-item (click)="onLogout()">
              <mat-icon>logout</mat-icon>
              <span>Logout</span>
            </button>
          </mat-menu>
        </ng-container>
      </div>
    </div>
  </div>
</mat-toolbar>
