<mat-sidenav-container class="sidenav-container" (backdropClick)="onBackdropClick()">
  <mat-sidenav
    #sidenav
    [opened]="opened"
    [mode]="mode"
    (openedChange)="openedChange.emit($event)"
    class="sidenav"
    [class.nav-dark]="sidenavTheme === 'dark' || (sidenavTheme === 'custom' && sidenavTextColor === '#ffffff')"
    [class.nav-custom]="sidenavTheme === 'custom'"
    [style.--sidebar-custom-surface]="sidenavBackgroundColor"
    [style.--sidebar-custom-text]="sidenavTextColor"
  >
    <div class="sidenav-content">
      <div *ngIf="mode !== 'side'" class="sidebar-toolbar">
        <span>Navigation</span>
        <button mat-icon-button class="sidebar-close" (click)="onToggle()" aria-label="Close navigation"><mat-icon>close</mat-icon></button>
      </div>
      <nav class="navigation-menu" aria-label="Main navigation">
        <section *ngFor="let section of navigationSections; let sectionIndex = index" class="nav-section" [attr.aria-labelledby]="'nav-section-' + sectionIndex">
          <h2 [id]="'nav-section-' + sectionIndex">{{section.label}}</h2>
          <mat-nav-list class="nav-list" [attr.aria-label]="section.label">
            <ng-container *ngFor="let item of section.items">
              <mat-divider *ngIf="item.id === 'admin-divider'" class="admin-divider"></mat-divider>
              <a *ngIf="item.id !== 'admin-divider' && !item.children?.length && item.route"
                 mat-list-item class="nav-item" [routerLink]="item.route" routerLinkActive="active"
                 [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page"
                 (click)="onNavigationItemClick(item)">
                <mat-icon matListItemIcon aria-hidden="true">{{item.icon}}</mat-icon>
                <span matListItemTitle class="item-content">{{item.label}}</span>
              </a>
              <button *ngIf="item.id !== 'admin-divider' && (item.children?.length || !item.route)"
                      type="button" class="nav-item nav-parent" [class.expanded]="isExpanded(item.id)"
                      [attr.aria-expanded]="item.children?.length ? isExpanded(item.id) : null"
                      [attr.aria-controls]="item.children?.length ? 'nav-children-' + item.id : null"
                      (click)="onNavigationItemClick(item)">
                <mat-icon aria-hidden="true">{{item.icon}}</mat-icon><span class="item-content">{{item.label}}</span>
                <mat-icon *ngIf="item.children?.length" class="expand-icon" [class.expanded]="isExpanded(item.id)" aria-hidden="true">expand_more</mat-icon>
              </button>
              <div *ngIf="item.children?.length && isExpanded(item.id)" class="children-container" [id]="'nav-children-' + item.id">
                <ng-container *ngFor="let child of item.children">
                  <a *ngIf="child.route" mat-list-item class="nav-item child-item" [routerLink]="child.route" routerLinkActive="active"
                     ariaCurrentWhenActive="page" (click)="onNavigationItemClick(child)">
                    <mat-icon matListItemIcon aria-hidden="true">{{child.icon}}</mat-icon><span matListItemTitle class="item-content">{{child.label}}</span>
                  </a>
                  <button *ngIf="!child.route" type="button" class="nav-item nav-parent child-item" (click)="onNavigationItemClick(child)">
                    <mat-icon aria-hidden="true">{{child.icon}}</mat-icon><span class="item-content">{{child.label}}</span>
                  </button>
                </ng-container>
              </div>
            </ng-container>
          </mat-nav-list>
        </section>
      </nav>
      <div class="sidebar-footer"><mat-icon aria-hidden="true">verified_user</mat-icon><span>Built for confident releases</span></div>
    </div>
  </mat-sidenav>
  <mat-sidenav-content class="sidenav-main-content"><ng-content></ng-content></mat-sidenav-content>
</mat-sidenav-container>
